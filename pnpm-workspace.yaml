# A package version must be at least a day old before pnpm will install it.
# Do not lower this. Add a trusted, urgent fix to minimumReleaseAgeExclude
# and remove it once the window has passed.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - unrs-resolver
