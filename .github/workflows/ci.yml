name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Catalog pull requests from tool-pipeline.yml use GITHUB_TOKEN, which does
  # not start pull_request or push workflows. Run this workflow by hand on the
  # pipeline branch. See docs/pipeline.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
